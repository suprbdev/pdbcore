version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (*compress/gzip.Reader).Close
        - (io.ReadCloser).Close
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, unparam]
      - path: testutil/catalog\.go
        linters: [gocritic]

formatters:
  enable:
    - gofmt
    - goimports
