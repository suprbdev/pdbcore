name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
      - name: Tests (race)
        run: go test -race ./...
      - name: No GraphQL dependency
        run: |
          if go list -deps ./... | grep -i gqlparser; then
            echo "pdbcore must not depend on gqlparser"; exit 1
          fi

  e2e:
    name: e2e (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ${{ fromJSON(github.event_name == 'pull_request' && '[14, 19]' || '[14, 15, 16, 17, 18, 19]') }}
    services:
      postgres:
        # PostGIS-enabled: the fixture schema creates the extension.
        image: postgis/postgis:${{ matrix.pg }}-3.7
        env:
          POSTGRES_USER: pdbcore
          POSTGRES_PASSWORD: pdbcore
          POSTGRES_DB: pdbcore_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U pdbcore"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install pgvector (best effort; its tests skip without it)
        run: |
          docker exec ${{ job.services.postgres.id }} sh -c 'apt-get update -qq && apt-get install -y -qq postgresql-$PG_MAJOR-pgvector' \
            || echo "::warning::pgvector unavailable; its tests will skip"
      - name: Load fixture schema
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client; }
          go run ./testutil/cmd/fixture | PGPASSWORD=pdbcore psql -v ON_ERROR_STOP=1 -h localhost -p 5434 -U pdbcore -d pdbcore_test -f -
      - name: DB-backed tests
        env:
          PDBCORE_TEST_DATABASE_URL: postgres://pdbcore:pdbcore@localhost:5434/pdbcore_test
        run: go test -race -count=1 ./testutil/ ./pgexec/ ./watch/ ./introspect/ ./postgis/ ./contrib/ ./metrics/

  downstream:
    name: downstream (${{ matrix.repo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [pdbq, pdbr]
    steps:
      - uses: actions/checkout@v4
        with:
          path: pdbcore
      - uses: actions/checkout@v4
        with:
          repository: suprbdev/${{ matrix.repo }}
          path: ${{ matrix.repo }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            pdbcore/go.sum
            ${{ matrix.repo }}/go.sum
      - name: Point ${{ matrix.repo }} at this checkout of pdbcore
        working-directory: ${{ matrix.repo }}
        run: |
          go mod edit -replace github.com/suprbdev/pdbcore=../pdbcore
          go mod tidy
      - name: Vet
        working-directory: ${{ matrix.repo }}
        run: go vet ./...
      - name: Unit and golden tests (race)
        working-directory: ${{ matrix.repo }}
        run: go test -race ./...
